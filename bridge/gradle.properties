org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true

# Generate the full Swift package + convos.js every run. The processor emits a
# single Swift package and one convos.js that aggregate ALL plugins; KSP's
# incremental mode only re-emits files affected by the changed input, which
# leaves the aggregated outputs partial and breaks the repo-root mirror in
# ConvosBridge/ and web/. Cost is tiny at this scale.
ksp.incremental=false
